[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-voice"
version = "0.1.0"
description = "Offline-first robot voice-control desktop system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6,<7",
  "qasync>=0.27,<1",
  "sounddevice>=0.4.7,<1",
  "numpy>=1.26,<3",
  "faster-whisper>=1.0,<2",
  "requests>=2.32,<3",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7,<7"]
robot = ["pyserial>=3.5,<4"]
tts = ["pywin32>=306; platform_system == 'Windows'"]
low_resource_asr = ["vosk>=0.3.45,<1"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-qt>=4.4,<5",
  "PySide6>=6.7,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-requests>=2.32.0.20240712",
  "types-PyYAML>=6.0.12.20250822",
  "PyInstaller>=6,<7",
]

[project.scripts]
robot-voice = "robot_voice.ui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["robot_voice"]
ignore_missing_imports = true
